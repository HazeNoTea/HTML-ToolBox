<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PDF颜色反转 - 高分辨率输出</title>
    <!-- pdf.js 和 pdf-lib -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(145deg, #eef2f5 0%, #d9e2ec 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .card {
            max-width: 680px;
            width: 100%;
            background: rgba(255,255,255,0.96);
            border-radius: 2rem;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.2);
            padding: 28px 30px 38px;
            backdrop-filter: blur(2px);
            transition: 0.2s;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 700;
            margin: 0 0 6px;
            background: linear-gradient(135deg, #1f3b4c, #1b516e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .sub {
            color: #2c5a74;
            border-left: 4px solid #2c7da0;
            padding-left: 14px;
            margin-bottom: 24px;
            font-size: 0.9rem;
        }
        .upload-area {
            background: #f9fcff;
            border: 2px dashed #bbd4f0;
            border-radius: 1.5rem;
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 20px;
        }
        .upload-area:hover {
            border-color: #2c7da0;
            background: #f0f7fe;
        }
        .upload-icon { font-size: 44px; margin-bottom: 8px; }
        input[type="file"] { display: none; }
        .btn-label {
            background: #2c7da0;
            color: white;
            border: none;
            padding: 10px 26px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            display: inline-block;
            transition: 0.2s;
            box-shadow: 0 3px 6px rgba(0,0,0,0.05);
        }
        .btn-label:hover { background: #1f5e7a; transform: scale(0.97); }
        .info-panel {
            background: #eef2f7;
            border-radius: 1.3rem;
            padding: 14px 20px;
            margin: 16px 0;
            font-size: 0.9rem;
        }
        .control-group {
            background: #eef2f7;
            border-radius: 1.3rem;
            padding: 14px 20px;
            margin: 16px 0;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .control-group label {
            font-weight: 600;
            color: #1f3b4c;
        }
        input[type="range"] {
            flex: 2;
            min-width: 160px;
            height: 5px;
            border-radius: 5px;
            background: #cbdae9;
        }
        .scale-value {
            background: white;
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1f5e7a;
        }
        .progress-container { margin-top: 18px; margin-bottom: 20px; }
        .progress-bar {
            background: #ccd7e6;
            border-radius: 40px;
            height: 10px;
            overflow: hidden;
        }
        .progress-fill {
            background: #2c7da0;
            width: 0%;
            height: 100%;
            transition: width 0.2s;
        }
        .status-text {
            font-size: 0.85rem;
            margin-top: 10px;
            font-weight: 500;
            color: #1a4b6e;
        }
        button {
            background: #1f4e6e;
            border: none;
            padding: 12px 22px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }
        button:disabled {
            background: #9bb7d0;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .footer-note {
            font-size: 0.7rem;
            text-align: center;
            color: #5b7c9c;
            margin-top: 28px;
            border-top: 1px solid #dee7f0;
            padding-top: 18px;
        }
        .badge {
            background: #d1e3f0;
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>🎨 高保真 PDF 反色工具</h1>
    <div class="sub">背景 · 文字 · 图片 全部反转 | 输出清晰锐利</div>

    <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📄</div>
        <div>点击或拖拽 PDF 文件至此</div>
        <div style="font-size: 0.75rem; margin-top: 8px;">本地处理，文件不上传</div>
        <input type="file" id="fileInput" accept=".pdf" />
        <div style="margin-top: 16px;"><span class="btn-label" id="selectBtn">选择文件</span></div>
    </div>

    <div id="fileInfo" style="display: none;" class="info-panel">
        📄 文件: <span id="fileName" class="badge"></span> &nbsp; | &nbsp; 页数: <span id="pageCount">—</span>
    </div>

    <!-- 分辨率控制滑块 -->
    <div class="control-group">
        <span>🔍 输出清晰度 (渲染倍率) </span>
        <input type="range" id="scaleSlider" min="1.2" max="4.0" step="0.1" value="3.0">
        <span class="scale-value" id="scaleValue">3.0x</span>
        <span class="badge">数值越高越清晰，处理稍慢</span>
    </div>

    <div class="progress-container" id="progressArea" style="display: none;">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="status-text" id="statusMsg">准备就绪</div>
    </div>

    <button id="downloadBtn" disabled>✨ 开始反转并下载高清晰度PDF</button>
    <div class="footer-note">
        ⚙️ 原理：高分辨率渲染 → 像素反转 → 嵌入原始尺寸PDF → 清晰度提升<br>
        💡 推荐倍率 2.5~3.5，过大会增加内存消耗，请根据设备性能选择。
    </div>
</div>

<script>
    // 配置 pdf.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // DOM 元素
    const fileInput = document.getElementById('fileInput');
    const selectBtn = document.getElementById('selectBtn');
    const uploadArea = document.getElementById('uploadArea');
    const fileInfoDiv = document.getElementById('fileInfo');
    const fileNameSpan = document.getElementById('fileName');
    const pageCountSpan = document.getElementById('pageCount');
    const progressArea = document.getElementById('progressArea');
    const progressFill = document.getElementById('progressFill');
    const statusMsg = document.getElementById('statusMsg');
    const downloadBtn = document.getElementById('downloadBtn');
    const scaleSlider = document.getElementById('scaleSlider');
    const scaleValueSpan = document.getElementById('scaleValue');

    let currentPdfBuffer = null;      // 原始PDF的ArrayBuffer
    let totalPages = 0;
    let isProcessing = false;

    // 显示渲染倍率
    scaleSlider.addEventListener('input', (e) => {
        scaleValueSpan.innerText = parseFloat(e.target.value).toFixed(1) + 'x';
    });

    function updateProgress(current, total, message) {
        const percent = (current / total) * 100;
        progressFill.style.width = `${percent}%`;
        statusMsg.innerText = message || `正在处理第 ${current} / ${total} 页 ...`;
    }

    function resetUI() {
        isProcessing = false;
        if (!currentPdfBuffer) {
            downloadBtn.disabled = true;
            downloadBtn.innerText = '📂 请先选择PDF文件';
            progressArea.style.display = 'none';
            fileInfoDiv.style.display = 'none';
        } else {
            downloadBtn.disabled = false;
            downloadBtn.innerText = '🎨 开始反转并下载高清晰度PDF';
        }
    }

    // 像素反转 (全通道取补色)
    function invertCanvasColors(canvas) {
        const ctx = canvas.getContext('2d');
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
            data[i] = 255 - data[i];     // R
            data[i+1] = 255 - data[i+1]; // G
            data[i+2] = 255 - data[i+2]; // B
        }
        ctx.putImageData(imageData, 0, 0);
        return canvas;
    }

    // canvas 转 JPEG Blob (高质量)
    function canvasToBlob(canvas, quality = 0.92) {
        return new Promise((resolve) => {
            canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
        });
    }

    // 主处理流程 (支持分辨率倍率)
    async function processAndDownload(pdfArrayBuffer, originalFileName, renderScale) {
        if (isProcessing) return;
        isProcessing = true;
        downloadBtn.disabled = true;
        downloadBtn.innerText = `⏳ 正在处理 (倍率 ${renderScale}x) 请稍候...`;
        progressArea.style.display = 'block';
        updateProgress(0, 1, '加载PDF文档...');

        try {
            const loadingTask = pdfjsLib.getDocument({ data: pdfArrayBuffer, useSystemFonts: true });
            const pdfDoc = await loadingTask.promise;
            totalPages = pdfDoc.numPages;
            pageCountSpan.innerText = totalPages;

            if (totalPages === 0) throw new Error('PDF没有页面');

            // 创建新PDF文档
            const newPdfDoc = await PDFLib.PDFDocument.create();

            for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                updateProgress(pageNum, totalPages, `第 ${pageNum} / ${totalPages} 页：高分辨率渲染中...`);
                const page = await pdfDoc.getPage(pageNum);
                
                // 获取原始页面尺寸 (单位: points, 1/72 inch)
                const originalViewport = page.getViewport({ scale: 1.0 });
                const originalWidth = originalViewport.width;
                const originalHeight = originalViewport.height;

                // 高分辨率渲染视口
                const highResViewport = page.getViewport({ scale: renderScale });
                const canvas = document.createElement('canvas');
                canvas.width = highResViewport.width;
                canvas.height = highResViewport.height;
                const ctx = canvas.getContext('2d');
                
                // 渲染PDF到canvas (背景白色，确保反转后背景变黑)
                await page.render({
                    canvasContext: ctx,
                    viewport: highResViewport,
                    background: 'white'
                }).promise;

                // 颜色反转 (全像素)
                invertCanvasColors(canvas);

                // 转为图像 blob (JPEG)
                const imageBlob = await canvasToBlob(canvas, 0.92);
                const imageArrayBuffer = await imageBlob.arrayBuffer();
                
                let embeddedImage;
                try {
                    embeddedImage = await newPdfDoc.embedJpg(imageArrayBuffer);
                } catch (err) {
                    console.warn('JPEG嵌入失败，回退PNG', err);
                    const pngBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                    const pngBuffer = await pngBlob.arrayBuffer();
                    embeddedImage = await newPdfDoc.embedPng(pngBuffer);
                }

                // 添加页面：使用原始PDF页面尺寸（保持物理大小不变）
                const newPage = newPdfDoc.addPage([originalWidth, originalHeight]);
                // 将高分辨率图像绘制到原始尺寸页面，自动执行高质量缩放 → 清晰度大幅提升
                newPage.drawImage(embeddedImage, {
                    x: 0,
                    y: 0,
                    width: originalWidth,
                    height: originalHeight,
                });

                // 释放canvas内存
                canvas.width = 0;
                canvas.height = 0;
                updateProgress(pageNum, totalPages, `第 ${pageNum} 页反转完成，正在合成...`);
            }

            updateProgress(totalPages, totalPages, '生成最终PDF文件...');
            const pdfBytes = await newPdfDoc.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            let outName = originalFileName.replace(/\.pdf$/i, '') + '_反转色_高清.pdf';
            if (!outName.toLowerCase().endsWith('.pdf')) outName += '.pdf';
            a.href = url;
            a.download = outName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            updateProgress(totalPages, totalPages, '✅ 处理完成！高清PDF已下载');
            statusMsg.style.color = '#1f7a5a';
            downloadBtn.innerText = '✅ 下载完成，可继续处理其他文件';
            isProcessing = false;
            downloadBtn.disabled = false;

        } catch (error) {
            console.error(error);
            statusMsg.innerText = `❌ 处理失败: ${error.message || '请检查PDF文件是否有效'}`;
            statusMsg.style.color = '#c23b22';
            downloadBtn.disabled = true;
            downloadBtn.innerText = '⚠️ 处理失败，重新选择文件';
            isProcessing = false;
            progressFill.style.width = '0%';
        }
    }

    // 处理文件选择
    function handleFile(file) {
        if (!file || file.type !== 'application/pdf') {
            alert('请选择一个有效的PDF文件');
            return;
        }
        progressArea.style.display = 'block';
        progressFill.style.width = '0%';
        statusMsg.innerText = '读取文件中...';
        statusMsg.style.color = '#1a4b6e';
        const reader = new FileReader();
        reader.onload = async (e) => {
            const arrayBuffer = e.target.result;
            currentPdfBuffer = arrayBuffer;
            fileNameSpan.innerText = file.name.length > 40 ? file.name.slice(0, 37)+'...' : file.name;
            fileInfoDiv.style.display = 'flex';
            // 预获取总页数
            try {
                const tempDoc = await pdfjsLib.getDocument({ data: arrayBuffer.slice(0) }).promise;
                totalPages = tempDoc.numPages;
                pageCountSpan.innerText = totalPages;
                downloadBtn.disabled = false;
                downloadBtn.innerText = '🎨 开始反转并下载高清晰度PDF';
                statusMsg.innerText = `就绪，共 ${totalPages} 页，当前倍率 ${scaleSlider.value}x`;
                progressFill.style.width = '0%';
            } catch (err) {
                pageCountSpan.innerText = '?';
                downloadBtn.disabled = false;
                downloadBtn.innerText = '⚠️ 尝试处理 (页数未知)';
                statusMsg.innerText = '文件可读取，点击按钮处理 (高倍率可能耗时)';
            }
        };
        reader.onerror = () => {
            alert('文件读取失败');
            resetUI();
        };
        reader.readAsArrayBuffer(file);
    }

    // 事件绑定
    selectBtn.addEventListener('click', () => fileInput.click());
    uploadArea.addEventListener('click', (e) => {
        if (e.target === uploadArea || uploadArea.contains(e.target) && !e.target.closest('#selectBtn')) {
            fileInput.click();
        }
    });
    fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
    });
    // 拖拽
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.style.background = '#e5f0fa';
        uploadArea.style.borderColor = '#2c7da0';
    });
    uploadArea.addEventListener('dragleave', () => {
        uploadArea.style.background = '#f9fcff';
        uploadArea.style.borderColor = '#bbd4f0';
    });
    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.style.background = '#f9fcff';
        const files = e.dataTransfer.files;
        if (files.length && files[0].type === 'application/pdf') {
            handleFile(files[0]);
            fileInput.files = files;
        } else alert('请拖放 PDF 文件');
    });

    // 处理按钮: 采用当前滑块倍率进行处理
    downloadBtn.addEventListener('click', async () => {
        if (!currentPdfBuffer) {
            alert('请先选择PDF文件');
            return;
        }
        if (isProcessing) {
            alert('正在处理中，请稍后');
            return;
        }
        let fileName = 'document.pdf';
        if (fileInput.files && fileInput.files[0]) fileName = fileInput.files[0].name;
        else if (fileNameSpan.innerText) fileName = fileNameSpan.innerText;
        const renderScale = parseFloat(scaleSlider.value);
        // 限制最大倍率4，避免内存过载 (但对大多数文档3.5以内安全)
        const safeScale = Math.min(renderScale, 4.5);
        await processAndDownload(currentPdfBuffer.slice(0), fileName, safeScale);
    });

    // 初始状态
    resetUI();
    statusMsg.innerText = '选择PDF，调节清晰度后点击按钮';
    progressArea.style.display = 'block';
    progressFill.style.width = '0%';
    downloadBtn.disabled = true;
    downloadBtn.innerText = '📁 请先选择PDF文件';
</script>
</body>
</html>
