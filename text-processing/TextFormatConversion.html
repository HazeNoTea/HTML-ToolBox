<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文本处理工具</title>
    <style>
        /* ===== 全局重置 & 深色主题 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #0a0a12;
            color: #e8e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ===== 主容器 ===== */
        .container {
            width: 100%;
            max-width: 820px;
            background: #14141f;
            border-radius: 20px;
            padding: 32px 36px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(139, 92, 246, 0.08);
            transition: box-shadow 0.3s ease;
        }

        .container:hover {
            box-shadow: 0 24px 72px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(139, 92, 246, 0.15);
        }

        /* ===== 标题 ===== */
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .header .icon {
            font-size: 28px;
            line-height: 1;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.3px;
            background: linear-gradient(135deg, #c084fc 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .badge {
            margin-left: auto;
            font-size: 12px;
            background: rgba(139, 92, 246, 0.18);
            color: #a78bfa;
            padding: 4px 12px;
            border-radius: 40px;
            border: 1px solid rgba(139, 92, 246, 0.2);
            letter-spacing: 0.3px;
            user-select: none;
        }

        /* ===== 功能开关 ===== */
        .function-switch {
            display: flex;
            gap: 8px;
            background: #1a1a2e;
            padding: 5px;
            border-radius: 14px;
            margin-bottom: 8px;
            border: 1px solid #2a2a4a;
        }

        .function-switch .btn-fn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 11px;
            background: transparent;
            color: #8888a0;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
            letter-spacing: 0.2px;
            position: relative;
        }

        .function-switch .btn-fn:hover {
            color: #c4b5d4;
            background: rgba(139, 92, 246, 0.06);
        }

        .function-switch .btn-fn.active {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #fff;
            box-shadow: 0 4px 16px rgba(139, 92, 246, 0.35), 0 0 0 1px rgba(139, 92, 246, 0.2);
        }

        .function-switch .btn-fn.active:hover {
            box-shadow: 0 6px 24px rgba(139, 92, 246, 0.45);
            transform: translateY(-1px);
        }

        .function-switch .btn-fn .fn-icon {
            margin-right: 6px;
        }

        /* ===== 功能描述 ===== */
        .fn-description {
            font-size: 13px;
            color: #8888a0;
            padding: 6px 4px 14px 4px;
            border-bottom: 1px solid #1f1f35;
            margin-bottom: 18px;
            min-height: 28px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fn-description .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #8b5cf6;
            flex-shrink: 0;
        }

        .fn-description .desc-text {
            transition: opacity 0.2s ease;
        }

        /* ===== 输入输出区域 ===== */
        .io-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .io-group .io-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 500;
            color: #a0a0b8;
            letter-spacing: 0.3px;
            padding: 0 2px;
        }

        .io-group .io-label .count {
            font-weight: 400;
            color: #666680;
            font-size: 12px;
        }

        .io-group textarea {
            width: 100%;
            height: 170px;
            padding: 16px 18px;
            border-radius: 14px;
            border: 1px solid #2a2a4a;
            background: #0e0e1a;
            color: #e8e8f0;
            font-size: 15px;
            font-family: "JetBrains Mono", "Fira Code", "Consolas", monospace;
            resize: vertical;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            line-height: 1.7;
            tab-size: 2;
        }

        .io-group textarea:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }

        .io-group textarea::placeholder {
            color: #555570;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
        }

        .io-group textarea.output-area {
            background: #0a0a14;
            border-color: #2a2a4a;
            color: #d4d4e8;
        }

        .io-group textarea.output-area:focus {
            border-color: #6d6d8a;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.06);
        }

        .io-group textarea.output-area::placeholder {
            color: #3d3d55;
        }

        /* ===== 输入与输出之间的箭头 ===== */
        .arrow-divider {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2px 0;
            color: #3d3d5a;
            font-size: 18px;
            user-select: none;
            letter-spacing: 4px;
        }

        .arrow-divider span {
            background: #14141f;
            padding: 0 14px;
            border-radius: 30px;
            font-size: 16px;
            color: #5a5a7a;
        }

        /* ===== 输出工具栏 ===== */
        .output-toolbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
        }

        .output-toolbar .copy-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 22px;
            border: none;
            border-radius: 40px;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
            box-shadow: 0 4px 16px rgba(139, 92, 246, 0.2);
            letter-spacing: 0.2px;
        }

        .output-toolbar .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(139, 92, 246, 0.35);
        }

        .output-toolbar .copy-btn:active {
            transform: scale(0.96);
        }

        .output-toolbar .copy-btn.copied {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
        }

        .output-toolbar .copy-btn .btn-icon {
            font-size: 16px;
        }

        .output-toolbar .copy-feedback {
            font-size: 13px;
            color: #34d399;
            opacity: 0;
            transition: opacity 0.3s ease;
            font-weight: 450;
        }

        .output-toolbar .copy-feedback.show {
            opacity: 1;
        }

        /* ===== 底部 ===== */
        .footer {
            margin-top: 22px;
            text-align: center;
            font-size: 12px;
            color: #44445e;
            letter-spacing: 0.3px;
            border-top: 1px solid #1a1a2e;
            padding-top: 18px;
        }

        .footer a {
            color: #6d6d8a;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: #a78bfa;
        }

        /* ===== 滚动条美化 ===== */
        textarea::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        textarea::-webkit-scrollbar-track {
            background: transparent;
        }

        textarea::-webkit-scrollbar-thumb {
            background: #3a3a5a;
            border-radius: 10px;
        }

        textarea::-webkit-scrollbar-thumb:hover {
            background: #5a5a7a;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .container {
                padding: 20px 16px 18px;
                border-radius: 16px;
            }

            .header h1 {
                font-size: 18px;
            }

            .header .badge {
                font-size: 10px;
                padding: 3px 10px;
            }

            .function-switch .btn-fn {
                font-size: 13px;
                padding: 8px 10px;
            }

            .function-switch .btn-fn .fn-icon {
                margin-right: 4px;
            }

            .io-group textarea {
                height: 130px;
                padding: 12px 14px;
                font-size: 14px;
            }

            .output-toolbar .copy-btn {
                padding: 8px 18px;
                font-size: 13px;
            }

            .fn-description {
                font-size: 12px;
                padding: 4px 2px 12px 2px;
            }

            .arrow-divider span {
                font-size: 13px;
                padding: 0 10px;
            }
        }

        @media (max-width: 420px) {
            .container {
                padding: 14px 10px 14px;
            }

            .function-switch {
                flex-direction: column;
                gap: 4px;
                padding: 4px;
            }

            .function-switch .btn-fn {
                padding: 8px 12px;
                font-size: 13px;
                text-align: center;
            }

            .io-group textarea {
                height: 110px;
                font-size: 13px;
                padding: 10px 12px;
            }

            .header h1 {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== 标题 ===== -->
        <div class="header">
            <span class="icon">⚡</span>
            <h1>文本处理工具</h1>
            <span class="badge">深色 · 离线</span>
        </div>

        <!-- ===== 功能切换 ===== -->
        <div class="function-switch" role="group" aria-label="功能选择">
            <button class="btn-fn active" data-fn="1" id="fn1">
                <span class="fn-icon">「」</span> 标点替换
            </button>
            <button class="btn-fn" data-fn="2" id="fn2">
                <span class="fn-icon">∑</span> LaTeX 转换
            </button>
        </div>

        <!-- ===== 功能描述 ===== -->
        <div class="fn-description" id="fnDesc">
            <span class="dot"></span>
            <span class="desc-text" id="descText">将英文逗号 <code>,</code>、括号 <code>( )</code>、冒号 <code>:</code> 替换为中文标点</span>
        </div>

        <!-- ===== 输入 & 输出 ===== -->
        <div class="io-group">

            <!-- 输入 -->
            <div class="io-label">
                <span>📥 输入</span>
                <span class="count" id="inputCount">0 字符</span>
            </div>
            <textarea id="inputArea" placeholder="在此输入或粘贴文本 …" spellcheck="false"></textarea>

            <!-- 箭头分隔 -->
            <div class="arrow-divider">
                <span>▼</span>
            </div>

            <!-- 输出 -->
            <div class="io-label">
                <span>📤 输出</span>
                <span class="count" id="outputCount">0 字符</span>
            </div>
            <textarea id="outputArea" class="output-area" placeholder="转换结果将显示在这里 …" readonly spellcheck="false"></textarea>

            <!-- 工具栏 -->
            <div class="output-toolbar">
                <span class="copy-feedback" id="copyFeedback">✅ 已复制</span>
                <button class="copy-btn" id="copyBtn">
                    <span class="btn-icon">📋</span> 复制结果
                </button>
            </div>
        </div>

        <!-- ===== 底部 ===== -->
        <div class="footer">
            自动转换 · 点击功能切换 · 输出框可滚动
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== DOM 引用 =====
            const fn1Btn = document.getElementById('fn1');
            const fn2Btn = document.getElementById('fn2');
            const descText = document.getElementById('descText');
            const inputArea = document.getElementById('inputArea');
            const outputArea = document.getElementById('outputArea');
            const copyBtn = document.getElementById('copyBtn');
            const copyFeedback = document.getElementById('copyFeedback');
            const inputCount = document.getElementById('inputCount');
            const outputCount = document.getElementById('outputCount');

            // ===== 状态 =====
            let currentFn = 1; // 1 或 2

            // ===== 功能描述文案 =====
            const descriptions = {
                1: '将英文逗号 <code>,</code>、括号 <code>( )</code>、冒号 <code>:</code> 替换为中文标点',
                2: '将 LaTeX 的 <code>\[ \]</code> 替换为 <code>$$ $$</code>，<code>\( \)</code> 替换为 <code>$ $</code>'
            };

            // ===== 核心转换函数 =====
            function transform(text, fn) {
                if (!text) return '';

                if (fn === 1) {
                    // 功能1：英文标点 → 中文标点
                    return text
                        .replace(/,/g, '，')
                        .replace(/\(/g, '（')
                        .replace(/\)/g, '）')
                        .replace(/:/g, '：');
                } else {
                    // 功能2：LaTeX → Obsidian
                    // \[ → $$  ,  \] → $$  ,  \( → $  ,  \) → $
                    // 注意 replace 中 $$ 表示单个 $，所以 $$$$ 表示两个 $
                    return text
                        .replace(/\\\[/g, '$$$$') // \[ → $$
                    .replace(/\\\]/g, '$$$$') // \] → $$
                    .replace(/\\\(/g, '$$') // \( → $
                    .replace(/\\\)/g, '$$'); // \) → $
                }
            }

            // ===== 更新输出 =====
            function updateOutput() {
                const input = inputArea.value;
                const result = transform(input, currentFn);
                outputArea.value = result;

                // 更新字符计数
                inputCount.textContent = input.length + ' 字符';
                outputCount.textContent = result.length + ' 字符';

                // 如果输出为空，显示占位样式
                if (!result) {
                    outputArea.style.color = '#555570';
                } else {
                    outputArea.style.color = '#d4d4e8';
                }
            }

            // ===== 切换功能 =====
            function setFunction(fn) {
                if (fn === currentFn) return;
                currentFn = fn;

                // 更新按钮状态
                fn1Btn.classList.toggle('active', fn === 1);
                fn2Btn.classList.toggle('active', fn === 2);

                // 更新描述
                descText.innerHTML = descriptions[fn];

                // 重新转换
                updateOutput();
            }

            // ===== 复制功能 =====
            function copyOutput() {
                const text = outputArea.value;
                if (!text) {
                    // 空内容时给个简单反馈
                    copyFeedback.textContent = '⚠️ 无内容可复制';
                    copyFeedback.classList.add('show');
                    setTimeout(() => {
                        copyFeedback.classList.remove('show');
                        copyFeedback.textContent = '✅ 已复制';
                    }, 1200);
                    return;
                }

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text)
                        .then(() => {
                            showCopySuccess();
                        })
                        .catch(() => {
                            fallbackCopy(text);
                        });
                } else {
                    fallbackCopy(text);
                }
            }

            function fallbackCopy(text) {
                // 使用 textarea 选中复制
                const temp = document.createElement('textarea');
                temp.value = text;
                temp.style.position = 'fixed';
                temp.style.left = '-9999px';
                temp.style.top = '-9999px';
                temp.style.opacity = '0';
                document.body.appendChild(temp);
                temp.select();
                try {
                    document.execCommand('copy');
                    showCopySuccess();
                } catch (e) {
                    alert('复制失败，请手动复制。');
                }
                document.body.removeChild(temp);
            }

            function showCopySuccess() {
                copyBtn.classList.add('copied');
                copyBtn.innerHTML = '<span class="btn-icon">✅</span> 已复制';
                copyFeedback.classList.add('show');
                // 重置按钮
                setTimeout(() => {
                    copyBtn.classList.remove('copied');
                    copyBtn.innerHTML = '<span class="btn-icon">📋</span> 复制结果';
                    copyFeedback.classList.remove('show');
                }, 1800);
            }

            // ===== 事件绑定 =====
            // 功能按钮
            fn1Btn.addEventListener('click', function() { setFunction(1); });
            fn2Btn.addEventListener('click', function() { setFunction(2); });

            // 输入实时转换
            inputArea.addEventListener('input', updateOutput);

            // 复制按钮
            copyBtn.addEventListener('click', copyOutput);

            // 键盘快捷键：Ctrl+Shift+C 复制
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'c' || e.key === 'C')) {
                    e.preventDefault();
                    copyOutput();
                }
            });

            // 支持用 Tab 键从输入框跳到复制按钮（可访问性）
            inputArea.addEventListener('keydown', function(e) {
                if (e.key === 'Tab' && !e.shiftKey) {
                    // 让 Tab 自然流动到下一个可聚焦元素
                }
            });

            // ===== 初始化 =====
            // 默认功能1激活
            setFunction(1);

            // 输入框自动获得焦点（但不要打扰用户？ 可以，但移动端会弹键盘，所以不强制）
            // 如果页面加载时用户希望直接输入，可以聚焦，但为了不干扰，我们不自动聚焦。
            // 但如果用户点击输入框，自然聚焦。

            // 如果输入框有预填内容，可以在这里设置测试样例（取消注释即可）
            // inputArea.value = '测试文本: (Hello, world!) 你好, 世界。';
            // updateOutput();

            console.log('📝 文本处理工具已加载 | 当前功能:', currentFn === 1 ? '标点替换' : 'LaTeX转换');
            console.log('💡 快捷键: Ctrl+Shift+C 复制结果');

        })();
    </script>

</body>
</html>
