<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CSV文件解析工具 | 在线表格查看器</title>
    <!-- 使用 Papa Parse 库进行强大稳定的 CSV 解析 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f5f7fc 0%, #eef2f7 100%);
            margin: 0;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 主卡片容器 */
        .csv-container {
            max-width: 1600px;
            width: 100%;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08), 0 8px 20px rgba(0,0,0,0.05);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .toolbar {
            background: white;
            padding: 1.2rem 2rem;
            border-bottom: 1px solid #e9edf2;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 1rem;
            row-gap: 1.2rem;
        }

        .upload-area {
            background: #f8fafd;
            border-radius: 1.2rem;
            padding: 0.75rem 1rem;
            flex: 2;
            min-width: 220px;
            border: 1px dashed #b9c4d1;
            transition: 0.2s;
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: #3b82f6;
            background: #f0f4fe;
        }

        .file-label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
        }

        .file-label input {
            display: none;
        }

        .icon {
            font-size: 1.4rem;
        }

        .drop-zone {
            border: 2px dashed #cbd5e1;
            background: #ffffffcc;
            border-radius: 1.2rem;
            padding: 0.9rem 1rem;
            text-align: center;
            font-size: 0.85rem;
            color: #475569;
            transition: 0.2s;
            cursor: pointer;
        }

        .drop-zone.drag-over {
            background: #eef2ff;
            border-color: #3b82f6;
            color: #1e40af;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-end;
            background: white;
            padding: 0 2rem 1rem 2rem;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #334155;
        }

        .control-group select, .control-group button {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 0.45rem 1rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .control-group select:hover, .control-group button:hover {
            background: #e6edf5;
            border-color: #94a3b8;
        }

        .primary-btn {
            background: #2563eb !important;
            color: white !important;
            border-color: #2563eb !important;
            font-weight: 600;
        }

        .primary-btn:hover {
            background: #1d4ed8 !important;
            transform: scale(0.97);
        }

        .info-bar {
            background: #f1f5f9;
            padding: 0.6rem 2rem;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            border-bottom: 1px solid #e2e8f0;
            color: #1e293b;
        }

        .search-area {
            padding: 0.8rem 2rem;
            background: white;
            border-bottom: 1px solid #eef2f6;
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 2;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 2rem;
            padding: 0.3rem 0.8rem;
        }

        .search-box input {
            border: none;
            background: transparent;
            padding: 0.5rem 0;
            width: 100%;
            outline: none;
            font-size: 0.85rem;
        }

        .pagination {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0.8rem 2rem 1.2rem;
            background: #fefefe;
            border-top: 1px solid #ecf3f9;
        }

        .page-btn {
            background: #f1f5f9;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 1.5rem;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .page-btn.active {
            background: #2563eb;
            color: white;
        }

        .table-wrapper {
            overflow-x: auto;
            max-height: 65vh;
            background: white;
            margin: 0 0 0 0;
            scroll-behavior: smooth;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 500px;
        }

        th {
            background: #f8fafc;
            padding: 0.85rem 0.8rem;
            text-align: left;
            font-weight: 600;
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            position: sticky;
            top: 0;
            background-color: #f8fafc;
            cursor: pointer;
            user-select: none;
            transition: background 0.1s;
        }

        th:hover {
            background: #eef2ff;
        }

        td {
            padding: 0.7rem 0.8rem;
            border-bottom: 1px solid #ecf3fa;
            color: #1e293b;
            word-break: break-word;
            white-space: pre-wrap;
        }

        tr:hover td {
            background-color: #fafcff;
        }

        .empty-message {
            text-align: center;
            padding: 3rem;
            color: #64748b;
            font-style: italic;
        }

        .error-message {
            background: #fee2e2;
            color: #b91c1c;
            padding: 0.6rem 1rem;
            border-radius: 1rem;
            margin: 0.5rem 2rem;
            font-size: 0.8rem;
        }

        .badge {
            background: #e2e8f0;
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
            font-size: 0.7rem;
            font-weight: 500;
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            padding: 1rem;
            color: #626e83;
            border-top: 1px solid #e9edf2;
            background: white;
        }

        @media (max-width: 680px) {
            body {
                padding: 1rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
<div class="csv-container">
    <div class="toolbar">
        <div class="upload-area" id="dropZone">
            <div class="drop-zone" id="dragDropText">
                📂 拖拽CSV文件至此，或 点击选择文件
                <input type="file" id="fileInput" accept=".csv,.text/csv, .csv" style="display: none;" />
            </div>
        </div>
        <div class="control-group">
            <span>🔤 文件编码</span>
            <select id="encodingSelect">
                <option value="UTF-8">UTF-8 (推荐)</option>
                <option value="GB18030">GB18030 / GBK (中文)</option>
                <option value="UTF-16LE">UTF-16 LE</option>
                <option value="UTF-16BE">UTF-16 BE</option>
            </select>
        </div>
        <div class="control-group">
            <span>📌 分隔符</span>
            <select id="delimiterSelect">
                <option value="auto">自动检测</option>
                <option value=",">逗号 ,</option>
                <option value=";">分号 ;</option>
                <option value="\t">制表符 Tab</option>
                <option value="|">竖线 |</option>
            </select>
        </div>
        <div class="control-group">
            <span>🏷️ 首行作为表头</span>
            <select id="headerSelect" style="min-width: 70px;">
                <option value="true">是</option>
                <option value="false">否 (自动列名)</option>
            </select>
        </div>
        <div class="control-group">
            <button id="reparseBtn" class="primary-btn">🔄 重新解析</button>
        </div>
    </div>

    <div class="info-bar" id="infoBar">
        <span>📄 未加载文件</span>
        <span>📊 行数: -</span>
    </div>

    <div class="search-area">
        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="搜索任意单元格内容 (不区分大小写)" autocomplete="off">
        </div>
        <div class="control-group" style="flex-direction:row; align-items:center; gap:6px;">
            <span>每页显示</span>
            <select id="pageSizeSelect" style="width: 70px;">
                <option value="20">20</option>
                <option value="50" selected>50</option>
                <option value="100">100</option>
                <option value="200">200</option>
            </select>
        </div>
        <span class="badge" id="filterCountBadge" style="background:#e0f2fe;">📌 过滤行数: -</span>
    </div>

    <div class="table-wrapper" id="tableWrapper">
        <table id="dataTable">
            <thead id="tableHeader"></thead>
            <tbody id="tableBody">
                <tr><td colspan="100" class="empty-message">✨ 请上传 CSV 文件，将自动解析并展示表格</td></tr>
            </tbody>
        </table>
    </div>

    <div class="pagination" id="paginationControls">
        <!-- 动态分页 -->
        <button class="page-btn" id="firstPageBtn">⏮ 首页</button>
        <button class="page-btn" id="prevPageBtn">◀ 上一页</button>
        <span id="pageInfo">第 1 / 1 页</span>
        <button class="page-btn" id="nextPageBtn">下一页 ▶</button>
        <button class="page-btn" id="lastPageBtn">末页 ⏭</button>
    </div>
    <footer>
        ⚡ 纯前端解析 | 支持大文件分页/排序/搜索 | 基于 PapaParse 引擎，兼容引号、换行符及多编码
    </footer>
</div>

<script>
    // ---------- 全局变量 ----------
    let currentFile = null;                 // 当前选中的File对象
    let rawColumns = [];                   // 原始列名数组 (字符串数组)
    let rawRows = [];                      // 原始行数据 (二维数组，与列一一对应)
    let filteredRows = [];                 // 当前经过搜索过滤后的行数据
    let sortColumnIndex = -1;              // 当前排序列索引
    let sortAscending = true;              // 升序/降序
    let currentPage = 1;
    let pageSize = 50;                     // 默认与select同步

    // DOM 元素
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const dragDropText = document.getElementById('dragDropText');
    const encodingSelect = document.getElementById('encodingSelect');
    const delimiterSelect = document.getElementById('delimiterSelect');
    const headerSelect = document.getElementById('headerSelect');
    const reparseBtn = document.getElementById('reparseBtn');
    const searchInput = document.getElementById('searchInput');
    const pageSizeSelect = document.getElementById('pageSizeSelect');
    const infoBar = document.getElementById('infoBar');
    const filterCountBadge = document.getElementById('filterCountBadge');
    const tableHeader = document.getElementById('tableHeader');
    const tableBody = document.getElementById('tableBody');
    const firstPageBtn = document.getElementById('firstPageBtn');
    const prevPageBtn = document.getElementById('prevPageBtn');
    const nextPageBtn = document.getElementById('nextPageBtn');
    const lastPageBtn = document.getElementById('lastPageBtn');
    const pageInfoSpan = document.getElementById('pageInfo');

    // ---------- 辅助函数 ----------
    function showError(msg) {
        const errDiv = document.createElement('div');
        errDiv.className = 'error-message';
        errDiv.innerText = `⚠️ 解析错误: ${msg}`;
        const container = document.querySelector('.csv-container');
        const oldErr = container.querySelector('.error-message');
        if(oldErr) oldErr.remove();
        container.insertBefore(errDiv, document.querySelector('.table-wrapper'));
        setTimeout(() => errDiv.remove(), 5000);
    }

    function clearError() {
        const oldErr = document.querySelector('.csv-container .error-message');
        if(oldErr) oldErr.remove();
    }

    // 更新信息栏 (原始行数, 列数)
    function updateInfoBar() {
        if(rawRows.length === 0 && rawColumns.length === 0) {
            infoBar.innerHTML = `<span>📄 无数据</span><span>📊 行数: 0</span>`;
            return;
        }
        const rowCount = rawRows.length;
        const colCount = rawColumns.length;
        const fileName = currentFile ? currentFile.name : 'CSV文件';
        infoBar.innerHTML = `<span>📄 ${fileName}</span><span>📊 总行数: ${rowCount.toLocaleString()}  |  列数: ${colCount}</span>`;
    }

    // 执行过滤 (基于搜索词)
    function applyFilter() {
        const searchTerm = searchInput.value.trim().toLowerCase();
        if (!searchTerm) {
            filteredRows = [...rawRows];
        } else {
            filteredRows = rawRows.filter(row => {
                // 遍历每个单元格，只要有一个包含搜索词就算匹配
                return row.some(cell => {
                    if (cell === undefined || cell === null) return false;
                    return String(cell).toLowerCase().includes(searchTerm);
                });
            });
        }
        // 过滤后重置排序状态 (以免排序索引相对于过滤后的数据集还保留旧排序,但是排序函数会在后续重新调用)
        // 但为了保持UI，排序index保留但需要重新应用排序到过滤结果上
        if (sortColumnIndex !== -1) {
            applySortToFiltered();
        } else {
            // 未排序则保持原过滤顺序 (原始顺序)
            // 注意: filteredRows 目前是原始过滤结果，但原始 rows 顺序不变，无需额外动作
        }
        updateFilterBadge();
        currentPage = 1;   // 重置到第一页
        renderTablePage();
    }

    // 对当前 filteredRows 进行排序 (基于sortColumnIndex)
    function applySortToFiltered() {
        if (sortColumnIndex === -1 || filteredRows.length === 0) return;
        const colIdx = sortColumnIndex;
        const asc = sortAscending;
        filteredRows.sort((a, b) => {
            let valA = (colIdx < a.length) ? a[colIdx] : '';
            let valB = (colIdx < b.length) ? b[colIdx] : '';
            // 处理 null / undefined
            valA = (valA === undefined || valA === null) ? '' : valA;
            valB = (valB === undefined || valB === null) ? '' : valB;
            // 智能排序：尝试转为数字进行比较（如果都是有效数字）
            const numA = Number(valA);
            const numB = Number(valB);
            if (!isNaN(numA) && !isNaN(numB) && valA !== '' && valB !== '') {
                return asc ? numA - numB : numB - numA;
            }
            // 字符串比较
            const strA = String(valA).toLowerCase();
            const strB = String(valB).toLowerCase();
            if (strA < strB) return asc ? -1 : 1;
            if (strA > strB) return asc ? 1 : -1;
            return 0;
        });
    }

    // 切换排序
    function handleSort(columnIndex) {
        if (sortColumnIndex === columnIndex) {
            sortAscending = !sortAscending;
        } else {
            sortColumnIndex = columnIndex;
            sortAscending = true;
        }
        // 对当前过滤数据集重新排序
        applySortToFiltered();
        currentPage = 1;
        renderTablePage();
        renderTableHeader();  // 刷新表头样式 (排序指示)
    }

    // 渲染表头 (带排序图标)
    function renderTableHeader() {
        if (!rawColumns.length) {
            tableHeader.innerHTML = '<tr><th>暂无数据</th></tr>';
            return;
        }
        let headerHtml = '<tr>';
        rawColumns.forEach((colName, idx) => {
            let sortIndicator = '';
            if (sortColumnIndex === idx) {
                sortIndicator = sortAscending ? ' 🔼' : ' 🔽';
            }
            headerHtml += `<th data-col-index="${idx}">${escapeHtml(colName)}${sortIndicator}</th>`;
        });
        headerHtml += '</tr>';
        tableHeader.innerHTML = headerHtml;
        // 绑定点击排序事件
        document.querySelectorAll('#tableHeader th').forEach(th => {
            const colIdx = th.getAttribute('data-col-index');
            if (colIdx !== null) {
                th.addEventListener('click', (e) => {
                    e.stopPropagation();
                    handleSort(parseInt(colIdx, 10));
                });
            }
        });
    }

    // 渲染当前页 (基于filteredRows + 分页)
    function renderTablePage() {
        if (!filteredRows.length) {
            tableBody.innerHTML = '<tr><td colspan="100" class="empty-message">🔍 没有匹配的数据，尝试修改搜索条件或重新上传</td></tr>';
            const totalPages = 1;
            pageInfoSpan.innerText = `第 0 / 0 页`;
            firstPageBtn.disabled = true;
            prevPageBtn.disabled = true;
            nextPageBtn.disabled = true;
            lastPageBtn.disabled = true;
            return;
        }
        const totalRows = filteredRows.length;
        const totalPages = Math.ceil(totalRows / pageSize);
        if (currentPage < 1) currentPage = 1;
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * pageSize;
        const end = Math.min(start + pageSize, totalRows);
        const pageRows = filteredRows.slice(start, end);
        
        let bodyHtml = '';
        for (const row of pageRows) {
            bodyHtml += '<tr>';
            for (let i = 0; i < rawColumns.length; i++) {
                let cellValue = (i < row.length) ? row[i] : '';
                if (cellValue === undefined || cellValue === null) cellValue = '';
                bodyHtml += `<td title="${escapeHtml(String(cellValue).substring(0, 200))}">${escapeHtml(String(cellValue))}</td>`;
            }
            bodyHtml += '</tr>';
        }
        tableBody.innerHTML = bodyHtml;
        
        // 更新分页UI
        pageInfoSpan.innerText = `第 ${currentPage} / ${totalPages} 页 (共 ${totalRows} 条)`;
        firstPageBtn.disabled = (currentPage === 1);
        prevPageBtn.disabled = (currentPage === 1);
        nextPageBtn.disabled = (currentPage === totalPages);
        lastPageBtn.disabled = (currentPage === totalPages);
    }

    function updateFilterBadge() {
        const filteredCount = filteredRows.length;
        const total = rawRows.length;
        filterCountBadge.innerText = `🔎 过滤后: ${filteredCount} / ${total}`;
    }

    // 核心解析函数: 基于当前文件/编码/分隔符/header选项
    async function parseCurrentFile() {
        if (!currentFile) {
            showError('请先选择 CSV 文件');
            return false;
        }
        clearError();
        // 显示加载中
        tableBody.innerHTML = '<tr><td colspan="100" class="empty-message">⏳ 正在解析文件，请稍候...</td></tr>';
        const encoding = encodingSelect.value;
        const delimiterRaw = delimiterSelect.value;
        const useHeader = headerSelect.value === 'true';
        let delimiter = delimiterRaw === 'auto' ? undefined : (delimiterRaw === '\\t' ? '\t' : delimiterRaw);
        
        try {
            // 读取二进制并根据编码转换为文本
            const text = await readFileWithEncoding(currentFile, encoding);
            if (!text) throw new Error('文件读取为空');
            // PapaParse 配置
            const config = {
                delimiter: delimiter,
                header: useHeader,
                skipEmptyLines: true,
                transform: (value) => value,
                transformHeader: (h) => h.trim() || `列_${Math.random()}`,
            };
            // 注意: header模式返回对象数组，否则二维数组
            const result = Papa.parse(text, config);
            if (result.errors && result.errors.length) {
                console.warn('解析警告:', result.errors);
                if (result.errors.some(e => e.type === 'Quotes' || e.code === 'UndetectableDelimiter')) {
                    showError(`CSV解析警告: ${result.errors[0].message}，但已尽力展示数据`);
                }
            }
            // 统一转换为 rawColumns / rawRows (二维数组)
            if (useHeader) {
                // data: [{col1:val1, col2:val2}], meta: {fields}
                const fields = result.meta.fields || [];
                if (fields.length === 0 && (!result.data || result.data.length === 0)) {
                    throw new Error('未检测到列信息');
                }
                rawColumns = fields.map(f => (f && f.trim()) ? f.trim() : `列_${Math.random()}`);
                const rowsData = result.data || [];
                rawRows = rowsData.map(rowObj => {
                    return rawColumns.map(col => (rowObj[col] !== undefined && rowObj[col] !== null) ? rowObj[col] : '');
                });
            } else {
                // 非表头模式: data是二维数组
                const dataArr = result.data || [];
                if (dataArr.length === 0) {
                    rawRows = [];
                    rawColumns = [];
                } else {
                    // 计算最大列宽
                    let maxCols = 0;
                    for (let row of dataArr) {
                        maxCols = Math.max(maxCols, row.length);
                    }
                    if (maxCols === 0) maxCols = 1;
                    rawColumns = Array.from({ length: maxCols }, (_, i) => `列 ${i+1}`);
                    rawRows = dataArr.map(row => {
                        const newRow = [...row];
                        while (newRow.length < maxCols) newRow.push('');
                        return newRow;
                    });
                }
            }
            // 过滤掉完全为空的行可选，但保留让数据纯净
            if (rawRows.length === 0) {
                throw new Error('CSV 文件无有效数据行');
            }
            // 重置所有过滤排序状态
            sortColumnIndex = -1;
            sortAscending = true;
            searchInput.value = '';
            filteredRows = [...rawRows];
            currentPage = 1;
            pageSize = parseInt(pageSizeSelect.value, 10);
            updateInfoBar();
            updateFilterBadge();
            renderTableHeader();
            renderTablePage();
            return true;
        } catch (err) {
            console.error(err);
            showError(`解析失败: ${err.message}`);
            tableBody.innerHTML = '<tr><td colspan="100" class="empty-message">❌ 解析失败，请检查格式或编码/分隔符设置</td></tr>';
            rawRows = [];
            rawColumns = [];
            filteredRows = [];
            updateInfoBar();
            renderTableHeader();
            return false;
        }
    }

    // 带编码读取文件: 返回 Promise<string>
    function readFileWithEncoding(file, encoding) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                let decoder;
                try {
                    decoder = new TextDecoder(encoding);
                    const text = decoder.decode(arrayBuffer);
                    resolve(text);
                } catch (decodeErr) {
                    reject(new Error(`编码解码失败: ${decodeErr.message}`));
                }
            };
            reader.onerror = () => reject(new Error('文件读取错误'));
            reader.readAsArrayBuffer(file);
        });
    }

    // 辅助 XSS 防护
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // 重置文件触发上传并解析
    function handleFile(file) {
        if (!file || !file.name.toLowerCase().endsWith('.csv') && file.type !== 'text/csv' && !file.name.includes('.csv')) {
            showError('请选择一个有效的 CSV 文件 (.csv)');
            return;
        }
        currentFile = file;
        parseCurrentFile();
    }

    // 拖拽和点击事件
    function setupDragAndDrop() {
        const dropContainer = dropZone;
        dropContainer.addEventListener('dragover', (e) => {
            e.preventDefault();
            dragDropText.classList.add('drag-over');
        });
        dropContainer.addEventListener('dragleave', () => {
            dragDropText.classList.remove('drag-over');
        });
        dropContainer.addEventListener('drop', (e) => {
            e.preventDefault();
            dragDropText.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });
        dropContainer.addEventListener('click', () => {
            fileInput.click();
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFile(e.target.files[0]);
            }
        });
    }

    // 监听搜索防抖
    let searchTimer;
    function bindSearchEvents() {
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                if (currentFile) {
                    applyFilter();
                }
            }, 350);
        });
        pageSizeSelect.addEventListener('change', () => {
            pageSize = parseInt(pageSizeSelect.value, 10);
            currentPage = 1;
            if (currentFile) {
                renderTablePage();
            }
        });
        reparseBtn.addEventListener('click', () => {
            if (currentFile) parseCurrentFile();
            else showError('没有已选中的文件，请先上传');
        });
    }

    function bindPaginationButtons() {
        firstPageBtn.addEventListener('click', () => {
            if (!filteredRows.length) return;
            currentPage = 1;
            renderTablePage();
        });
        prevPageBtn.addEventListener('click', () => {
            if (currentPage > 1) { currentPage--; renderTablePage(); }
        });
        nextPageBtn.addEventListener('click', () => {
            const maxPage = Math.ceil(filteredRows.length / pageSize);
            if (currentPage < maxPage) { currentPage++; renderTablePage(); }
        });
        lastPageBtn.addEventListener('click', () => {
            if (!filteredRows.length) return;
            const maxPage = Math.ceil(filteredRows.length / pageSize);
            currentPage = maxPage;
            renderTablePage();
        });
    }

    // 初始化
    function init() {
        setupDragAndDrop();
        bindSearchEvents();
        bindPaginationButtons();
        // 示例默认创建一个空白占位
    }
    init();
</script>
</body>
</html>
